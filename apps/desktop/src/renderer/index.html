<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    />
    <title>Stella</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="title">
        <span id="status-dot" class="dot" aria-hidden="true"></span>
        <h1>Stella</h1>
      </div>
      <button id="reset" class="ghost" type="button" title="Começar uma conversa nova">
        Nova conversa
      </button>
    </header>

    <div id="banner" class="banner" role="status" hidden>
      <p id="banner-text"></p>
      <button id="retry" type="button">Tentar de novo</button>
    </div>

    <main id="messages" class="messages" aria-live="polite">
      <p class="empty" id="empty">Diga oi para a Stella. Tudo roda aqui no seu computador.</p>
    </main>

    <form id="composer" class="composer">
      <label class="sr-only" for="input">Mensagem</label>
      <textarea
        id="input"
        rows="2"
        maxlength="8000"
        placeholder="Escreva uma mensagem… (Enter envia, Shift+Enter quebra linha)"
      ></textarea>
      <button id="send" type="submit">Enviar</button>
    </form>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
